spring.application.name=fitness-monolith
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/befit_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:my_db_password}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
jwt.secret=${JWT_SECRET:YOUR_SECURE_JWT_SECRET_KEY_MIN_256_BITS_CHANGE_IN_PRODUCTION}
jwt.expiration=${JWT_EXPIRATION:86400000}

