spring.application.name=fitness-monolith
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/befit_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:your_db_password}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Configuration
jwt.secret=${JWT_SECRET:YOUR_SECURE_JWT_SECRET_KEY_MIN_256_BITS_CHANGE_IN_PRODUCTION}
jwt.expiration=${JWT_EXPIRATION:86400000}

